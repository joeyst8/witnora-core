[package]
name = "witnora-ve"
version = "0.1.0"
edition = "2021"
description = "Exact bounded #SAT variable elimination kernel for Witnora"
license = "MIT"

[lib]
name = "witnora_ve"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.11"
serde_json = "1.0"
pyo3 = { version = "0.25", optional = true, features = ["extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 1
