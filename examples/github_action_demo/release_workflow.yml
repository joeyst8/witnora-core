name: Release Trust Card

on:
  workflow_dispatch:

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify selected release proof evidence
        uses: ./.github/actions/witnora-verify
        with:
          source-zip: dist/witnora-core-v1.0-public-preprint.zip
          diagnostic-zip: dist/witnora-core-v0.9.8-full-tseitin-minfill-diagnostic.zip
          manifest: dist/RELEASE_ASSETS_MANIFEST_v1.0-public-preprint.md
          depth: partial
          select: instance
          select-instance: tseitin_20:c=2
          rerun-drat-trim: "false"
          max-replay-proofs: "1"
          fail-on-risk-flags: HASH_MISMATCH,MISSING_FILE,UNVERIFIED_CLAIM,ACTION_INPUT_MISMATCH
          fail-on-verdict: NOT_VERIFIED,PARTIALLY_VERIFIED,OVERCLAIM
          out-dir: witnora-verify-out
          upload-artifacts: "true"

      - name: Prepare release trust-card upload plan
        run: |
          python scripts/attach_release_trust_card.py \
            --tag v1.0-public-preprint-final \
            --trust-card witnora-verify-out/trust_card.md \
            --report witnora-verify-out/release_verification_report.json \
            --manifest dist/RELEASE_ASSETS_MANIFEST_v1.0-public-preprint.md \
            --out-dir release-trust-plan
