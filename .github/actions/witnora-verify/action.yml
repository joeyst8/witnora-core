name: Witnora Verify
description: Scoped artifact verification and partial replay trust cards for technical releases.
author: Witnora-Core

branding:
  icon: shield
  color: blue

inputs:
  source-zip:
    required: true
    description: Source archive path.
  diagnostic-zip:
    required: true
    description: Diagnostic artifact path.
  manifest:
    required: true
    description: Release asset manifest path.
  depth:
    required: false
    default: metadata
    description: Verification depth. Supported values are metadata and partial.
  select:
    required: false
    default: largest
    description: Partial replay selection policy. Supported values are largest, first, all, and instance.
  select-instance:
    required: false
    default: ""
    description: Selected instance when select is instance, for example tseitin_20:c=2.
  rerun-drat-trim:
    required: false
    default: "false"
    description: Whether to rerun drat-trim on selected proof evidence.
  drat-trim:
    required: false
    default: ""
    description: Path to drat-trim for optional replay.
  max-replay-proofs:
    required: false
    default: "1"
    description: Maximum selected proofs to replay with drat-trim.
  replay-timeout-seconds:
    required: false
    default: "120"
    description: Timeout for each optional drat-trim replay.
  fail-on:
    required: false
    default: hash_mismatch,overclaim,missing_file
    description: Backward-compatible comma-separated fail conditions.
  fail-on-risk-flags:
    required: false
    default: ""
    description: Comma-separated risk flags that fail the action.
  fail-on-verdict:
    required: false
    default: ""
    description: Comma-separated verdicts that fail the action.
  out-dir:
    required: false
    default: witnora-verify-out
    description: Directory for verification reports and trust card.
  upload-artifacts:
    required: false
    default: "false"
    description: Upload report and trust card using actions/upload-artifact.

outputs:
  verdict:
    description: Verification verdict.
    value: ${{ steps.verify.outputs.verdict }}
  certification_level:
    description: Verification certification level.
    value: ${{ steps.verify.outputs.certification_level }}
  verification_depth:
    description: Verification depth used by the report.
    value: ${{ steps.verify.outputs.verification_depth }}
  replay_depth:
    description: Replay depth used by the report.
    value: ${{ steps.verify.outputs.replay_depth }}
  risk_flags:
    description: JSON array of risk flags.
    value: ${{ steps.verify.outputs.risk_flags }}
  selected_evidence:
    description: JSON array of selected evidence.
    value: ${{ steps.verify.outputs.selected_evidence }}
  trust_card_path:
    description: Generated Markdown trust card path.
    value: ${{ steps.verify.outputs.trust_card_path }}
  report_path:
    description: Generated JSON verification report path.
    value: ${{ steps.verify.outputs.report_path }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      run: |
        set -euo pipefail
        DRAT_ARGS=()
        if [ "${{ inputs.rerun-drat-trim }}" = "true" ]; then
          DRAT_ARGS+=(--rerun-drat-trim)
        fi
        if [ -n "${{ inputs.drat-trim }}" ]; then
          DRAT_ARGS+=(--drat-trim "${{ inputs.drat-trim }}")
        fi
        python -m witnora_core.ci \
          --source-zip "${{ inputs.source-zip }}" \
          --diagnostic-zip "${{ inputs.diagnostic-zip }}" \
          --manifest "${{ inputs.manifest }}" \
          --depth "${{ inputs.depth }}" \
          --select "${{ inputs.select }}" \
          --select-instance "${{ inputs.select-instance }}" \
          --max-replay-proofs "${{ inputs.max-replay-proofs }}" \
          --replay-timeout-seconds "${{ inputs.replay-timeout-seconds }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --fail-on-risk-flags "${{ inputs.fail-on-risk-flags }}" \
          --fail-on-verdict "${{ inputs.fail-on-verdict }}" \
          --out-dir "${{ inputs.out-dir }}" \
          "${DRAT_ARGS[@]}"
    - if: ${{ inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: witnora-verify-report
        path: ${{ inputs.out-dir }}/
