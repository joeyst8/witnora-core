name: W022 external SAT spectral pilot

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - "rust/witnora-ve/src/bin/witnora_spectral_profile.rs"
      - "tests/test_spectral_profile_rust.py"
      - "scripts/benchmark_w022_vlsat.py"
      - ".github/workflows/w022-external-spectral.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w022-independent-and-external:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build native Rust profiler and numerical control tests
        run: |
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_spectral_profile
          cargo build --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_spectral_profile
          WITNORA_RUST_SPECTRAL_BIN="$PWD/rust/witnora-ve/target/release/witnora_spectral_profile" python -m unittest tests.test_spectral_profile_rust -v
      - name: Build pinned official Kissat
        run: |
          git clone --quiet --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/w022-kissat"
          cd "$RUNNER_TEMP/w022-kissat"
          ./configure
          make -C build -j 2 kissat
          echo "W022_KISSAT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "W022_KISSAT_BIN=$RUNNER_TEMP/w022-kissat/build/kissat" >> "$GITHUB_ENV"
      - name: Frozen INRIA VLSAT-2 source and performance audit
        env:
          W022_REPORT_PATH: ${{ runner.temp }}/w022_external_spectral.json
        run: |
          WITNORA_RUST_SPECTRAL_BIN="$PWD/rust/witnora-ve/target/release/witnora_spectral_profile" python -m scripts.benchmark_w022_vlsat
      - name: Preserve source hashes, timings and censored results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w022-external-vlsat2-results
          path: ${{ runner.temp }}/w022_external_spectral.json
          if-no-files-found: ignore
