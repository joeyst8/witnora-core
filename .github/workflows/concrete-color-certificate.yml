name: Concrete edge-list coloring certificate Lean check

on:
  push:
    branches:
      - research/concrete-color-certificate-v29
  pull_request:
    paths:
      - "formal/Witnora/ConcreteColorCertificate.lean"
      - ".github/workflows/concrete-color-certificate.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check edge list checker and executable triangle example
        working-directory: formal
        run: lake build Witnora.ConcreteColorCertificate
      - name: Reject unproved or unsafe declarations
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]])' formal/Witnora/ConcreteColorCertificate.lean; then
            echo "Unproved declaration in concrete color certificate"
            exit 1
          fi
