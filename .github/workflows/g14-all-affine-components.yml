name: Every Python G14 affine residual

on:
  push:
    branches:
      - research/g14-all-affine-components-v52
  pull_request:
    paths:
      - "witnora_core/python_g14_lean_artifact.py"
      - "tests/test_g14_size_ladder.py"
      - ".github/workflows/g14-all-affine-components.yml"
  workflow_dispatch:

jobs:
  all-residuals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract native G5 evidence for all residual components
        run: PYTHONPATH=. python -m unittest tests.test_g14_size_ladder -v
      - name: Generate Lean source for all 2/3/4-component branches
        run: PYTHONPATH=. python scripts/generate_g14_size_ladder_lean.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Build semantic exactness and source soundness
        working-directory: formal
        run: lake build Witnora.ExactAffineMembership Witnora.G14ConcreteBridge
      - name: Verify every component in size 2
        working-directory: formal
        run: lake env lean Witnora/GeneratedG14Size2.lean
      - name: Verify every component in size 3
        working-directory: formal
        run: lake env lean Witnora/GeneratedG14Size3.lean
      - name: Verify every component in size 4
        working-directory: formal
        run: lake env lean Witnora/GeneratedG14Size4.lean
      - name: Reject proof holes and native_decide
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/GeneratedG14Size{2,3,4}.lean; then
            exit 1
          fi
