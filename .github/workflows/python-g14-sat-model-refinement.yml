name: Python G14 SAT model refinement
on:
  push:
    branches:
      - formal/python-g14-sat-model-refinement-v109
  pull_request:
    paths:
      - "scripts/generate_python_g14_sat_model_lean.py"
      - "tests/test_python_g14_sat_model_lean.py"
      - ".github/workflows/python-g14-sat-model-refinement.yml"
  workflow_dispatch:
jobs:
  python-and-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Python generator regression
        run: python -m unittest tests.test_python_g14_sat_model_lean -v
      - name: Produce artifact from actual Python G14 conditioning
        run: python -m scripts.generate_python_g14_sat_model_lean
      - name: Kernel-check Python-generated source and residuals
        working-directory: formal
        run: lake build Witnora.GeneratedPythonG14Sat
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/GeneratedPythonG14Sat.lean; then
            exit 1
          fi
