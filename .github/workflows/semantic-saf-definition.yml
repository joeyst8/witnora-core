name: Semantic SAF family theorem

on:
  push:
    branches:
      - research/semantic-saf-definition-v54
  pull_request:
    paths:
      - "formal/Witnora/SemanticSAF.lean"
      - ".github/workflows/semantic-saf-definition.yml"
  workflow_dispatch:

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check independent SAF definition and redundant-clause closure
        working-directory: formal
        run: lake build Witnora.SemanticSAF
      - name: Reject project axioms and proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/SemanticSAF.lean; then
            exit 1
          fi
