name: G14 primal edge ownership
on:
  push:
    branches:
      - formal/g14-primal-edge-component-owner-v113
  pull_request:
    paths:
      - "formal/Witnora/G14PrimalEdgeOwnership.lean"
      - ".github/workflows/g14-primal-edge-ownership.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check primal-edge owner theorem
        working-directory: formal
        run: lake build Witnora.G14PrimalEdgeOwnership
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14PrimalEdgeOwnership.lean; then
            exit 1
          fi
