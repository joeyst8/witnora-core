name: G14 DFS label edge checker
on:
  push:
    branches:
      - formal/g14-dfs-label-edge-check-v114
  pull_request:
    paths:
      - "formal/Witnora/G14DFSLabelCheck.lean"
      - "scripts/generate_g14_dfs_labels_lean.py"
      - "tests/test_g14_dfs_labels_lean.py"
      - ".github/workflows/g14-dfs-label-edge-check.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check universal source edge label theorem
        working-directory: formal
        run: lake build Witnora.G14DFSLabelCheck
      - name: Test Python DFS label fixture generator
        run: python -m unittest tests.test_g14_dfs_labels_lean -v
      - name: Generate real Python DFS component labels
        run: python -m scripts.generate_g14_dfs_labels_lean
      - name: Kernel-check Python labels and mutated labels
        working-directory: formal
        run: lake build Witnora.GeneratedG14DFSLabels
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14DFSLabelCheck.lean formal/Witnora/GeneratedG14DFSLabels.lean; then
            exit 1
          fi
