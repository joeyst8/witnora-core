name: Multi-variable parity separator research gate

on:
  push:
    branches:
      - 'research/multicut-parity-separator-v6'
  pull_request:
    paths:
      - 'witnora_core/multicut_parity_separator.py'
      - 'tests/test_multicut_parity_separator.py'
      - 'scripts/benchmark_multicut_parity_separator.py'
      - '.github/workflows/multicut-parity-separator.yml'

jobs:
  multicut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify minimal 2 and 3 variable cuts
        run: PYTHONPATH=. python -m unittest tests.test_multicut_parity_separator -v
      - name: Challenge unfamiliar SAT families
        run: PYTHONPATH=. python scripts/benchmark_multicut_parity_separator.py
      - name: Preserve discovery ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multicut-parity-${{ github.sha }}
          path: multicut-parity-study.csv
          if-no-files-found: ignore
