name: Kempe structural repair

on:
  push:
    branches:
      - research/kempe-repair-v23
  pull_request:
    paths:
      - "witnora_core/kempe_repair_lab.py"
      - "scripts/experiment_kempe_repair.py"
      - "tests/test_kempe_repair_lab.py"
      - ".github/workflows/kempe-repair.yml"
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify color-preserving Kempe swaps
        run: PYTHONPATH=. python -m unittest tests.test_kempe_repair_lab -v
      - name: Challenge unresolved train and holdout graph corpus
        run: PYTHONPATH=. python scripts/experiment_kempe_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: kempe-repair-ledger
          path: kempe-repair-ledger.json
