name: G5 finite sparse pivot pass

on:
  push:
    branches:
      - formal/g5-terminating-pivot-pass-v64
  pull_request:
    paths:
      - "formal/Witnora/G5TerminatingPivot.lean"
      - ".github/workflows/g5-terminating-pivot.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check finite Gaussian elimination pass
        working-directory: formal
        run: lake build Witnora.G5TerminatingPivot
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5TerminatingPivot.lean; then
            exit 1
          fi
