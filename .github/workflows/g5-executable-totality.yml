name: G5 executable totality
on:
  push:
    branches: [formal/g5-executable-totality-v106]
  pull_request:
    paths:
      - "formal/Witnora/G5ExecutableTotality.lean"
      - ".github/workflows/g5-executable-totality.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check indexed G5 execution totality
        working-directory: formal
        run: lake build Witnora.G5ExecutableTotality
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5ExecutableTotality.lean; then
            exit 1
          fi