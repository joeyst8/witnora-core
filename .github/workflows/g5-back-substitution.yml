name: G5 back-substitution proof

on:
  push:
    branches:
      - formal/g5-back-substitution-v66
  pull_request:
    paths:
      - "formal/Witnora/G5BackSubstitution.lean"
      - ".github/workflows/g5-back-substitution.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check pivot back-substitution foundation
        working-directory: formal
        run: lake build Witnora.G5BackSubstitution
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5BackSubstitution.lean; then
            exit 1
          fi
