name: G5 survivor contradiction shape
on:
  push:
    branches: [formal/g5-survivor-contradiction-shape-v95]
  pull_request:
    paths:
      - "formal/Witnora/G5SurvivorContradictionShape.lean"
      - ".github/workflows/g5-survivor-contradiction-shape.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check survivor contradiction shape
        working-directory: formal
        run: lake build Witnora.G5SurvivorContradictionShape
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5SurvivorContradictionShape.lean; then
            exit 1
          fi