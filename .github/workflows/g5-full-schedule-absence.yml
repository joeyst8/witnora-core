name: G5 full schedule absence
on:
  push:
    branches: [formal/g5-full-schedule-absence-v90]
  pull_request:
    paths:
      - "formal/Witnora/G5FullScheduleAbsence.lean"
      - ".github/workflows/g5-full-schedule-absence.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check full schedule absence invariant
        working-directory: formal
        run: lake build Witnora.G5FullScheduleAbsence
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5FullScheduleAbsence.lean; then
            exit 1
          fi