name: Kernel ASCII numeric certificates

on:
  push:
    branches:
      - research/kernel-ascii-numeric-v34
  pull_request:
    paths:
      - "formal/Witnora/KernelAsciiNumericCertificate.lean"
      - ".github/workflows/kernel-ascii-numeric.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check byte-list parser soundness, positive certificate, and malformed cases
        working-directory: formal
        run: lake build Witnora.KernelAsciiNumericCertificate
      - name: Reject proof holes, unsafe declarations, and native evaluation
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]])|native_decide' formal/Witnora/KernelAsciiNumericCertificate.lean; then
            echo "Untrusted construct found in kernel ASCII parser"
            exit 1
          fi
