name: General-resolution universal UNSAT bridge

on:
  push:
    branches:
      - formal/g14-python-seen-enqueue-v121
    paths:
      - "formal/Witnora/GeneralResolution.lean"
      - "formal/Witnora/GeneralResolutionIndexed.lean"
      - "formal/Witnora/GeneralResolutionStream.lean"
      - "formal/Witnora/GeneralResolutionAscii.lean"
      - "formal/Witnora/GeneralRUP.lean"
      - "formal/Witnora/GeneralRUPAscii.lean"
      - "formal/Witnora/GeneralRUPIndexed.lean"
      - "formal/Witnora/GeneralRUPIndexedAscii.lean"
      - "scripts/generate_general_resolution_lean.py"
      - "scripts/generate_general_rup_lean.py"
      - "tests/test_glucose_drup_import.py"
      - "scripts/generate_glucose_drup_rup_lean.py"
      - "scripts/benchmark_cdcl_rup_scaling.py"
      - "scripts/generate_glucose_dense_3sat_lean.py"
      - "tests/test_glucose_dense_3sat.py"
      - "witnora_core/rup_witness_import.py"
      - "witnora_core/rup_indexed_propagation.py"
      - "tests/test_rup_indexed_propagation.py"
      - "scripts/benchmark_rup_indexed_propagation.py"
      - "scripts/generate_glucose_indexed_rup_lean.py"
      - "tests/test_general_rup_indexed.py"
      - "witnora_core/eth_clause_violation_parity.py"
      - "tests/test_eth_clause_violation_parity.py"
      - "formal/Witnora/ClauseViolationParity.lean"
      - "scripts/generate_eth_clause_violation_parity_lean.py"
      - "tests/test_general_resolution_trace.py"
      - "tests/test_general_rup_trace.py"
      - ".github/workflows/general-resolution-lean.yml"
  pull_request:
    paths:
      - "formal/Witnora/GeneralResolution.lean"
      - "formal/Witnora/GeneralResolutionIndexed.lean"
      - "formal/Witnora/GeneralResolutionStream.lean"
      - "formal/Witnora/GeneralResolutionAscii.lean"
      - "formal/Witnora/GeneralRUP.lean"
      - "formal/Witnora/GeneralRUPAscii.lean"
      - "formal/Witnora/GeneralRUPIndexed.lean"
      - "formal/Witnora/GeneralRUPIndexedAscii.lean"
      - "scripts/generate_general_resolution_lean.py"
      - "scripts/generate_general_rup_lean.py"
      - "tests/test_glucose_drup_import.py"
      - "scripts/generate_glucose_drup_rup_lean.py"
      - "scripts/benchmark_cdcl_rup_scaling.py"
      - "scripts/generate_glucose_dense_3sat_lean.py"
      - "tests/test_glucose_dense_3sat.py"
      - "witnora_core/rup_witness_import.py"
      - "witnora_core/rup_indexed_propagation.py"
      - "tests/test_rup_indexed_propagation.py"
      - "scripts/benchmark_rup_indexed_propagation.py"
      - "scripts/generate_glucose_indexed_rup_lean.py"
      - "tests/test_general_rup_indexed.py"
      - "witnora_core/eth_clause_violation_parity.py"
      - "tests/test_eth_clause_violation_parity.py"
      - "formal/Witnora/ClauseViolationParity.lean"
      - "scripts/generate_eth_clause_violation_parity_lean.py"
      - "tests/test_general_resolution_trace.py"
      - "tests/test_general_rup_trace.py"
      - ".github/workflows/general-resolution-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Install pinned independent CDCL solver
        run: python -m pip install "python-sat==1.8.dev24"
      - name: Kernel-check universal resolution soundness
        working-directory: formal
        run: lake build Witnora.GeneralResolution Witnora.GeneralResolutionIndexed Witnora.GeneralResolutionStream Witnora.GeneralResolutionAscii Witnora.GeneralRUP Witnora.GeneralRUPAscii Witnora.GeneralRUPIndexed Witnora.GeneralRUPIndexedAscii
      - name: Kernel-check universal clause-violation parity soundness
        working-directory: formal
        run: lake build Witnora.ClauseViolationParity

      - name: Exhaustively verify source-bound ETH-style parity sketches
        run: python -m unittest tests.test_eth_clause_violation_parity -v

      - name: Generate bounded source-CNF versus parity-equivalence checks
        run: python -m scripts.generate_eth_clause_violation_parity_lean > formal/Witnora/GeneratedETHParity.lean

      - name: Lean-check exact parity sketches on dense UNSAT and SAT controls
        working-directory: formal
        run: lake env lean Witnora/GeneratedETHParity.lean

      - name: Test independent proof generation and tamper rejection
        run: python -m unittest tests.test_general_resolution_trace tests.test_general_rup_trace tests.test_glucose_drup_import tests.test_glucose_dense_3sat tests.test_rup_indexed_propagation tests.test_general_rup_indexed -v
      - name: Generate non-affine CNF resolution examples
        run: python -m scripts.generate_general_resolution_lean > formal/Witnora/GeneratedGeneralResolution.lean
      - name: Lean-check all generated non-affine examples
        working-directory: formal
        run: lake env lean Witnora/GeneratedGeneralResolution.lean
      - name: Generate explicit non-affine RUP unit witnesses
        run: python -m scripts.generate_general_rup_lean > formal/Witnora/GeneratedGeneralRUP.lean
      - name: Lean-check proposed RUP additions and forged witness rejection
        working-directory: formal
        run: lake env lean Witnora/GeneratedGeneralRUP.lean
      - name: Generate independently sourced Glucose DRUP RUP witnesses
        run: python -m scripts.generate_glucose_drup_rup_lean > formal/Witnora/GeneratedGlucoseDRUP.lean
      - name: Lean-check actual CDCL refutations
        working-directory: formal
        run: lake env lean Witnora/GeneratedGlucoseDRUP.lean
      - name: Measure frozen non-affine CDCL proof annotation scaling
        run: python -m scripts.benchmark_cdcl_rup_scaling

      - name: Generate real dense random 3SAT and planted-SAT controls
        run: python -m scripts.generate_glucose_dense_3sat_lean > formal/Witnora/GeneratedDense3SAT.lean
      - name: Lean-check dense no-small-separator 3SAT and positive SAT models
        working-directory: formal
        run: lake env lean Witnora/GeneratedDense3SAT.lean

      - name: Compare indexed and reference DRUP annotation on frozen cases
        run: python -m scripts.benchmark_rup_indexed_propagation

      - name: Generate actual Glucose indexed row-reason RUP certificates
        run: python -m scripts.generate_glucose_indexed_rup_lean > formal/Witnora/GeneratedIndexedRUP.lean
      - name: Lean-check exact RUP reason rows and forged-index rejection
        working-directory: formal
        run: lake env lean Witnora/GeneratedIndexedRUP.lean

