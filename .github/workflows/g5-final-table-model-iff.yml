name: G5 final table model iff
on:
  push:
    branches: [formal/g5-final-table-model-iff-v103]
  pull_request:
    paths:
      - "formal/Witnora/G5FinalTableModelIff.lean"
      - ".github/workflows/g5-final-table-model-iff.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check final candidate model equivalence
        working-directory: formal
        run: lake build Witnora.G5FinalTableModelIff
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5FinalTableModelIff.lean; then
            exit 1
          fi