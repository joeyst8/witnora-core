name: G5 global survivor normal form
on:
  push:
    branches: [formal/g5-global-survivor-normal-form-v94]
  pull_request:
    paths:
      - "formal/Witnora/G5GlobalSurvivorNormalForm.lean"
      - ".github/workflows/g5-global-survivor-normal-form.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check global survivor normal form
        working-directory: formal
        run: lake build Witnora.G5GlobalSurvivorNormalForm
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5GlobalSurvivorNormalForm.lean; then
            exit 1
          fi