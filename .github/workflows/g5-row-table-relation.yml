name: G5 row table relation
on:
  push:
    branches: [formal/g5-row-table-relation-v74]
  pull_request:
    paths:
      - "formal/Witnora/G5RowTableRelation.lean"
      - ".github/workflows/g5-row-table-relation.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check exact G5 row table relation
        working-directory: formal
        run: lake build Witnora.G5RowTableRelation
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5RowTableRelation.lean; then
            exit 1
          fi
