name: G5 selected pivot persistence
on:
  push:
    branches: [formal/g5-selected-pivot-persistence-v91]
  pull_request:
    paths:
      - "formal/Witnora/G5SelectedPivotPersistence.lean"
      - ".github/workflows/g5-selected-pivot-persistence.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check selected pivot persistence
        working-directory: formal
        run: lake build Witnora.G5SelectedPivotPersistence
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5SelectedPivotPersistence.lean; then
            exit 1
          fi