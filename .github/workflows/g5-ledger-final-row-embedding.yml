name: G5 ledger final row embedding
on:
  push:
    branches: [formal/g5-ledger-final-row-embedding-v101]
  pull_request:
    paths:
      - "formal/Witnora/G5LedgerFinalRowEmbedding.lean"
      - ".github/workflows/g5-ledger-final-row-embedding.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check ledger final-row embedding
        working-directory: formal
        run: lake build Witnora.G5LedgerFinalRowEmbedding
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5LedgerFinalRowEmbedding.lean; then
            exit 1
          fi