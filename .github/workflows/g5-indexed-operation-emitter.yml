name: G5 indexed operation to DAG emitter

on:
  push:
    branches:
      - formal/g5-indexed-operation-emitter-v68
  pull_request:
    paths:
      - "formal/Witnora/G5IndexedOperationEmitter.lean"
      - ".github/workflows/g5-indexed-operation-emitter.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check mutable indexed operations to DAG
        working-directory: formal
        run: lake build Witnora.G5IndexedOperationEmitter
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5IndexedOperationEmitter.lean; then
            exit 1
          fi
