name: W034 exact-audited weighted spectral LP small-formula pilot

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - 'scripts/w034_weighted_walsh.py'
      - 'scripts/benchmark_w034_weighted_small.py'
      - 'tests/test_w034_weighted_walsh.py'
      - 'docs/W_CROSSDOMAIN_034_WEIGHTED_SPECTRAL_PROTOCOL.md'
      - '.github/workflows/w034-weighted-spectral-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-integer-audited-lp-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin numerical candidate generator, not proof authority
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Independently audit exact integer proofs and known failure case
        run: python -m unittest tests.test_w034_weighted_walsh tests.test_w033_walsh_bound -v
      - name: Freeze and exhaustively verify 200 exact source formulas
        env:
          W034_REPORT_PATH: ${{ runner.temp }}/w034_weighted_small_raw.json
        run: python -m scripts.benchmark_w034_weighted_small
      - name: Preserve complete original formulas and candidate integer proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w034-weighted-raw
          path: ${{ runner.temp }}/w034_weighted_small_raw.json
          if-no-files-found: ignore
          retention-days: 90
