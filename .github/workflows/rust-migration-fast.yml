  workflow_dispatch:

concurrency:
  group: witnora-rust-focused-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  focused-native:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 122
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust library tests
        run: cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --lib
      - name: Build Python native wheel
        run: |
          python -m pip install --disable-pip-version-check "maturin>=1.9,<2"
          maturin build --manifest-path rust/witnora-ve/Cargo.toml --release --features python --out rust/witnora-ve/wheels
          python -m pip install --disable-pip-version-check rust/witnora-ve/wheels/*.whl
      - name: W-CROSSDOMAIN-006 factorized partition-polynomial differential gate
        run: |
          python -c 'from witnora_ve import aux_factorized_violation_profile_native'
          python -m unittest tests.test_factorized_violation_profile_rust -v
      - name: Build pinned external drat-trim
        run: |
          git clone --quiet https://github.com/marijnheule/drat-trim.git "$RUNNER_TEMP/witnora-drat-trim"
          git -C "$RUNNER_TEMP/witnora-drat-trim" checkout --quiet --detach 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C "$RUNNER_TEMP/witnora-drat-trim" drat-trim
          echo "WITNORA_DRAT_TRIM=$RUNNER_TEMP/witnora-drat-trim/drat-trim" >> "$GITHUB_ENV"
      - name: Focused native and research R-067 through R-500 checks
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: |
          python -m unittest tests.test_hidden_separator_generator_rust -v
          python -m unittest tests.test_symbolic_implication_rust -v
          python -m unittest tests.test_hard_separator_generator_rust -v
          python -m unittest tests.test_satlib_fingerprint_rust -v
          python -m unittest tests.test_spoke_collapse_rust -v
          python -m unittest tests.test_ood_sat_families_rust -v
          python -m unittest tests.test_benchmark_families_rust -v
          python -m unittest tests.test_parity_compression_rust -v
          python -m unittest tests.test_crc_structural_independence_rust -v
