name: Universal G14 DFS fuel bound
on:
  push:
    branches:
      - formal/g14-dfs-universal-fuel-bound-v116
  pull_request:
    paths:
      - "formal/Witnora/G14DFSFiniteFuel.lean"
      - ".github/workflows/g14-dfs-universal-fuel.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check universal DFS completion budget
        working-directory: formal
        run: lake build Witnora.G14DFSFiniteFuel
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14DFSFiniteFuel.lean; then
            exit 1
          fi
