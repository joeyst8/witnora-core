name: TC-063 canonical affine local G5 completion

on:
  push:
    branches:
      - research/autonomous-parity-separator-repair-v118
    paths:
      - formal/Witnora/TC063CanonicalLocalG5.lean
      - .github/workflows/tc063-canonical-local-g5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-local-g5:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check CNF-to-indexed-G5 completeness for canonical witnesses
        working-directory: formal
        run: lake build Witnora.TC063CanonicalLocalG5
