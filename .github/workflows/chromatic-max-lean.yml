name: Chromatic maximum Lean consequence gate

on:
  push:
    branches:
      - 'research/chromatic-max-lean-v19'
  pull_request:
    paths:
      - 'formal/Witnora/ChromaticMaxConsequences.lean'
      - '.github/workflows/chromatic-max-lean.yml'

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check arithmetic consequences without sorry
        working-directory: formal
        run: lake env lean Witnora/ChromaticMaxConsequences.lean
      - name: Reject sorry and added axiom declarations in this file
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]])' formal/Witnora/ChromaticMaxConsequences.lean; then
            echo "Unproved declaration in chromatic consequences"
            exit 1
          fi
