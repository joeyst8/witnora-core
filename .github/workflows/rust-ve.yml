concurrency:
  group: witnora-rust-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust compiler unit, random, bigint and budget tests
        run: cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --all-targets
      - name: Build Rust native counting executable
        run: cargo build --release --manifest-path rust/witnora-ve/Cargo.toml
      - name: Build in-process Rust extension wheel
        run: |
          python -m pip install --disable-pip-version-check "maturin>=1.9,<2"
          maturin build --manifest-path rust/witnora-ve/Cargo.toml --release --features python --out rust/witnora-ve/wheels
          python -m pip install --disable-pip-version-check rust/witnora-ve/wheels/*.whl
      - name: Install independent exact counter
        run: python -m pip install --disable-pip-version-check python-sat pyganak==2.8.0
      - name: Compare Rust and Python mathematical operation counts
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_crc_rust_backend -v
      - name: Compare Rust and Python source components versus Ganak
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m scripts.benchmark_rust_ve
      - name: Verify Rust preprocessing preserves source assignments
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_crc_rust_preprocess -v
      - name: Full Rust preprocessing plus CRC counting versus Ganak
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m scripts.benchmark_rust_preprocess
      - name: Verify Rust source XOR extractor against Python reference
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_crc_rust_xor -v
      - name: Benchmark native XOR source extraction against Ganak
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m scripts.benchmark_rust_xor
      - name: Verify exact native right Walsh coefficient spectra
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_crc_rust_walsh -v
      - name: Benchmark right coefficient engine versus independent Ganak
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m scripts.benchmark_rust_walsh
      - name: Verify exact native GF2 projection and sparse Fourier
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_crc_rust_affine -v
      - name: Benchmark native affine Fourier against independent Ganak
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m scripts.benchmark_rust_affine
      - name: Verify complete one-call Rust source counting against brute force and staged path
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_crc_rust_fused -v
      - name: Benchmark exact fused source-to-count against staged Rust and independent Ganak
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m scripts.benchmark_rust_fused
      - name: Verify zero-Python standalone Rust DIMACS executable
        run: |
          result="$(printf 'p cnf 2 2\n1 0\n-2 0\n' | rust/witnora-ve/target/release/witnora-ve --fused-dimacs)"
          test "$result" = 's mc 1'
          result="$(printf 'p cnf 3 1\n0\n' | rust/witnora-ve/target/release/witnora-ve --fused-dimacs)"
          test "$result" = 's mc 0'
      - name: Verify R-010 exact native two-SAT against Python SCC and witnesses
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_two_sat_rust -v
      - name: Verify standalone native two-SAT SAT witnesses and contradictions
        run: |
          result="$(printf 'p cnf 2 2\n1 0\n-2 0\n' | rust/witnora-ve/target/release/witnora-ve --two-sat-dimacs)"
          test "$result" = "$(printf 's SATISFIABLE\nv 1 -2 0')"
          result="$(printf 'p cnf 1 2\n1 0\n-1 0\n' | rust/witnora-ve/target/release/witnora-ve --two-sat-dimacs)"
          test "$result" = 's UNSATISFIABLE'
      - name: Verify R-011 canonical CNF and subsumption against Python reference
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_cnf_rust -v
      - name: Verify R-012 native DIMACS exact source spellings and raw clause evidence
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_dimacs_evidence_rust -v
      - name: Verify R-013 indexed RUP witness against the original producer
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_rup_indexed_rust -v
      - name: Verify R-014 exact RUP-subset replay decisions and warnings against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_rup_checker_rust -v
      - name: Verify Python-free RUP proof replay CLI accepts proof and rejects false proof
        run: |
          fixture_dir="$(mktemp -d)"
          printf 'p cnf 1 2\n1 0\n-1 0\n' > "$fixture_dir/unsat.cnf"
          printf '0\n' > "$fixture_dir/proof.drat"
          result="$(rust/witnora-ve/target/release/witnora-ve --check-rup "$fixture_dir/unsat.cnf" "$fixture_dir/proof.drat")"
          test "$result" = 's VERIFIED_RUP_SUBSET'
          printf 'p cnf 1 1\n1 0\n' > "$fixture_dir/sat.cnf"
          if rust/witnora-ve/target/release/witnora-ve --check-rup "$fixture_dir/sat.cnf" "$fixture_dir/proof.drat"; then
            echo "Expected invalid proof to exit nonzero"
            exit 1
          fi
      - name: Verify R-016 primal graph, components and hashes against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_graph_rust -v
      - name: Verify R-017 exact bounded treewidth orders against Python search
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_treewidth_rust -v
      - name: Verify R-018 exact blocked clause proofs and digests against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_bce_rust -v
      - name: Verify R-019 complete simplification decisions and certificate logs
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_simplify_rust -v
      - name: Verify R-020 exact variable elimination proof events and order replays
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_ve_proof_rust -v
      - name: Verify R-021 complete native two-SAT SCC proof metadata and logs
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_two_sat_proof_rust -v
      - name: Verify R-022 native SHA-256 canonical proof hashes against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_cnf_hash_rust -v
      - name: Verify R-023 Rust BCE SHA-256 proof digests against Python repr
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_bce_digest_rust -v
      - name: Verify R-024 exact Rust certificate StepLogger records against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_step_logger_rust -v
      - name: Verify R-025 byte-exact stable certificate JSON and SHA256 against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_certificate_json_rust -v
      - name: Verify R-026 Rust bundle file hashes and real .wcert parity
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_bundle_manifest_rust -v
      - name: Verify R-027 compact native top-level certificate SHA256 with Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_certificate_hash_rust -v
      - name: Verify R-028 native file-integrity checker and real tamper rejection
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_certificate_verify_rust -v
      - name: Verify R-029 complete SAT assignment reconstruction and error parity
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_reconstruction_rust -v
      - name: Verify R-030 native deterministic UP PLE SUB BCE VE proof replay and tamper rejection
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_local_replay_rust -v
      - name: Verify R-031 native 2-SAT and treewidth certificate replay and tampering
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_solver_replay_rust -v
      - name: Verify R-032 complete native component metadata against Python replay
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_component_evidence_rust -v
      - name: Verify R-033 native CD checker and adversarial first-error parity
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_component_verify_rust -v
      - name: Verify R-034 Rust-authenticated CD child states against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_component_children_rust -v
      - name: Verify R-035 component-context Rust proof stream versus full Python verifier
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_component_stream_rust -v
      - name: Verify R-036 pre-CD root transitions and component streams against Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_component_prefix_rust -v
      - name: Verify R-037 independent native 2-SAT SCC resolution proof provenance
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_two_sat_scc_witness_rust -v
      - name: Verify R-038 graph elimination order and independent replay parity
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_factor_orders_rust -v
      - name: Verify R-039 exact bounded failed-literal probing versus Python
        env:
          WITNORA_RUST_VE_BIN: rust/witnora-ve/target/release/witnora-ve
        run: python -m unittest tests.test_forced_relation_rust -v
