name: W023 deflated signed spectrum VLSAT2 holdout

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - "rust/witnora-ve/src/bin/witnora_deflated_spectrum.rs"
      - "rust/witnora-ve/src/bin/witnora_spectral_profile.rs"
      - "tests/test_deflated_spectrum_rust.py"
      - "scripts/benchmark_w023_vlsat.py"
      - ".github/workflows/w023-deflated-frustration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Differential Rust numerical and gauge-invariance tests
        run: |
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_deflated_spectrum
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_spectral_profile
          cargo build --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_deflated_spectrum
          WITNORA_RUST_DEFLATED_BIN="$PWD/rust/witnora-ve/target/release/witnora_deflated_spectrum" python -m unittest tests.test_deflated_spectrum_rust -v
      - name: Build release-pinned Kissat
        run: |
          git clone --quiet --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/w023-kissat"
          cd "$RUNNER_TEMP/w023-kissat"
          ./configure
          make -C build -j 2 kissat
          echo "W023_KISSAT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "W023_KISSAT_BIN=$RUNNER_TEMP/w023-kissat/build/kissat" >> "$GITHUB_ENV"
      - name: Run preregistered INRIA heldout
        env:
          W023_REPORT_PATH: ${{ runner.temp }}/w023_external_deflated.json
        run: |
          WITNORA_RUST_DEFLATED_BIN="$PWD/rust/witnora-ve/target/release/witnora_deflated_spectrum" python -m scripts.benchmark_w023_vlsat
      - name: Preserve raw source fingerprints and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w023-heldout-vlsat2
          path: ${{ runner.temp }}/w023_external_deflated.json
          if-no-files-found: ignore
