name: G5 executable target clearance
on:
  push:
    branches: [formal/g5-executable-target-clearance-v87]
  pull_request:
    paths:
      - "formal/Witnora/G5ExecutableTargetClearance.lean"
      - ".github/workflows/g5-executable-target-clearance.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check executable target-row pivot clearance
        working-directory: formal
        run: lake build Witnora.G5ExecutableTargetClearance
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5ExecutableTargetClearance.lean; then
            exit 1
          fi
