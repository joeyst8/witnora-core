name: G5 global row model invariant
on:
  push:
    branches: [formal/g5-global-row-model-invariant-v84]
  pull_request:
    paths:
      - "formal/Witnora/G5GlobalRowModelInvariant.lean"
      - ".github/workflows/g5-global-row-model-invariant.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check G5 row model invariance
        working-directory: formal
        run: lake build Witnora.G5GlobalRowModelInvariant
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5GlobalRowModelInvariant.lean; then
            exit 1
          fi
