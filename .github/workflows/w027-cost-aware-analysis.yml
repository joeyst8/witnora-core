name: W027 cost-aware statistical analysis verification

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - "scripts/analyze_w027_break_even.py"
      - "tests/test_w027_break_even.py"
      - ".github/workflows/w027-cost-aware-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-break-even-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify cost formula, 96-pair accounting, and censored safeguards
        run: python -m unittest tests.test_w027_break_even -v
