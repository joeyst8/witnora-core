name: G5 reversible elimination invariants

on:
  push:
    branches:
      - formal/g5-elimination-invariant-v63
  pull_request:
    paths:
      - "formal/Witnora/G5EliminationInvariant.lean"
      - ".github/workflows/g5-elimination-invariant.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check reversible row elimination
        working-directory: formal
        run: lake build Witnora.G5EliminationInvariant
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5EliminationInvariant.lean; then
            exit 1
          fi
