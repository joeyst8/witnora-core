name: G14 Python seen-at-enqueue refinement

on:
  push:
    branches:
      - formal/g14-python-seen-enqueue-v121
  pull_request:
    paths:
      - "formal/Witnora/G14DFSSeenEnqueue.lean"
      - "formal/Witnora/G14DFSOuterScan.lean"
      - "formal/Witnora/G14DFSPreseen.lean"
      - "formal/Witnora/G14DFSOwnerLabels.lean"
      - "formal/Witnora/G14DFSModelBridge.lean"
      - "formal/Witnora/TC063CompletenessReduction.lean"
      - "formal/Witnora/TC063CanonicalAffineBridge.lean"
      - "formal/Witnora/TC063PatternPermutation.lean"
      - "formal/Witnora/TC063CanonicalBound.lean"
      - "formal/Witnora/TC063SparseDirectChecker.lean"
      - "formal/Witnora/TC063SparseCover.lean"
      - "formal/Witnora/TC063SparseG5OperationBound.lean"
      - "formal/Witnora/TC063SparseDagResource.lean"
      - "formal/Witnora/TC063PythonCompilerModel.lean"
      - "formal/Witnora/TC063PythonOperationCodec.lean"
      - "formal/Witnora/TC063EliminationPairSignal.lean"
      - "witnora_core/lean_g5_gate.py"
      - "tests/test_lean_g5_gate.py"
      - "tests/test_lean_g5_wire_real.py"
      - "witnora_core/separator_structural_priority.py"
      - "witnora_core/separator_affine_family_theorem.py"
      - "tests/test_separator_structural_priority.py"
      - "witnora_core/g5_elimination_activity.py"
      - "tests/test_g5_elimination_activity.py"
      - "tests/test_g5_elimination_activity_robustness.py"
      - "tests/test_g5_elimination_activity_crossfamilies.py"
      - "tests/test_g5_activity_hybrid_heldout.py"
      - "tests/test_g5_pairwise_dense_bridge.py"
      - "scripts/generate_python_g5_compiler_differential_lean.py"
      - ".github/workflows/g14-dfs-seen-enqueue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check seen-at-enqueue invariants
        working-directory: formal
        run: lake build Witnora.G14DFSSeenEnqueue Witnora.G14DFSOuterScan Witnora.G14DFSPreseen Witnora.G14DFSOwnerLabels Witnora.G14DFSModelBridge Witnora.TC063CompletenessReduction Witnora.TC063CanonicalAffineBridge Witnora.TC063PatternPermutation Witnora.TC063CanonicalBound Witnora.TC063SparseDirectChecker Witnora.TC063SparseCover Witnora.TC063SparseG5OperationBound Witnora.TC063SparseDagResource Witnora.TC063PythonCompilerModel Witnora.TC063PythonOperationCodec Witnora.TC063EliminationPairSignal
      - name: Production G5 numeric-wire gate unit and real Lean smoke tests
        run: python -m unittest tests.test_lean_g5_gate tests.test_lean_g5_wire_real -v
      - name: Exercise structural separator prototype and independent graph oracle
        run: python -m unittest tests.test_separator_structural_priority tests.test_separator_affine_family_theorem -v
      - name: Study elimination-derived separator hints on a non-articulation graph
        run: python -m unittest tests.test_g5_elimination_activity -v
      - name: Adversarial relabeling and equation-order activity study
        run: python -m unittest tests.test_g5_elimination_activity_robustness -v
      - name: Independent biconnected topology and clique control study
        run: python -m unittest tests.test_g5_elimination_activity_crossfamilies -v
      - name: Held-out degree vs G5 hybrid topology challenge
        run: python -m unittest tests.test_g5_activity_hybrid_heldout -v
      - name: Regular 2-cut dense-bridge pairwise scale study
        run: python -m unittest tests.test_g5_pairwise_dense_bridge -v
      - name: Emit actual Python G5 compiler differential trace assertions
        run: python -m scripts.generate_python_g5_compiler_differential_lean > formal/Witnora/GeneratedPythonG5CompilerDifferential.lean
      - name: Lean-check every Python compiler differential result
        working-directory: formal
        run: lake env lean Witnora/GeneratedPythonG5CompilerDifferential.lean
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14DFSSeenEnqueue.lean formal/Witnora/G14DFSOuterScan.lean formal/Witnora/G14DFSPreseen.lean formal/Witnora/G14DFSOwnerLabels.lean formal/Witnora/G14DFSModelBridge.lean formal/Witnora/TC063CompletenessReduction.lean formal/Witnora/TC063CanonicalAffineBridge.lean formal/Witnora/TC063PatternPermutation.lean formal/Witnora/TC063CanonicalBound.lean formal/Witnora/TC063SparseDirectChecker.lean formal/Witnora/TC063SparseCover.lean formal/Witnora/TC063SparseG5OperationBound.lean formal/Witnora/TC063SparseDagResource.lean formal/Witnora/TC063PythonCompilerModel.lean formal/Witnora/TC063PythonOperationCodec.lean formal/Witnora/TC063EliminationPairSignal.lean; then
            exit 1
          fi
