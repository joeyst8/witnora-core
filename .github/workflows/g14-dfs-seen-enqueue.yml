name: G14 Python seen-at-enqueue refinement

on:
  push:
    branches:
      - formal/g14-python-seen-enqueue-v121
  pull_request:
    paths:
      - "formal/Witnora/G14DFSSeenEnqueue.lean"
      - "formal/Witnora/G14DFSOuterScan.lean"
      - "formal/Witnora/G14DFSPreseen.lean"
      - "formal/Witnora/G14DFSOwnerLabels.lean"
      - "formal/Witnora/G14DFSModelBridge.lean"
      - "formal/Witnora/TC063CompletenessReduction.lean"
      - "formal/Witnora/TC063CanonicalAffineBridge.lean"
      - "formal/Witnora/TC063PatternPermutation.lean"
      - "formal/Witnora/TC063CanonicalBound.lean"
      - "formal/Witnora/TC063SparseDirectChecker.lean"
      - "formal/Witnora/TC063SparseCover.lean"
      - ".github/workflows/g14-dfs-seen-enqueue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check seen-at-enqueue invariants
        working-directory: formal
        run: lake build Witnora.G14DFSSeenEnqueue Witnora.G14DFSOuterScan Witnora.G14DFSPreseen Witnora.G14DFSOwnerLabels Witnora.G14DFSModelBridge Witnora.TC063CompletenessReduction Witnora.TC063CanonicalAffineBridge Witnora.TC063PatternPermutation Witnora.TC063CanonicalBound Witnora.TC063SparseDirectChecker Witnora.TC063SparseCover
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14DFSSeenEnqueue.lean formal/Witnora/G14DFSOuterScan.lean formal/Witnora/G14DFSPreseen.lean formal/Witnora/G14DFSOwnerLabels.lean formal/Witnora/G14DFSModelBridge.lean formal/Witnora/TC063CompletenessReduction.lean formal/Witnora/TC063CanonicalAffineBridge.lean formal/Witnora/TC063PatternPermutation.lean formal/Witnora/TC063CanonicalBound.lean formal/Witnora/TC063SparseDirectChecker.lean formal/Witnora/TC063SparseCover.lean; then
            exit 1
          fi
