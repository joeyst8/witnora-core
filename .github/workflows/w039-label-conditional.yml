name: W039 frozen label-conditional geometry experiment

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - 'scripts/benchmark_w039_label_conditioned.py'
      - 'tests/test_w039_label_conditioned.py'
      - 'docs/W_CROSSDOMAIN_039_LABEL_CONDITIONAL_PROTOCOL.md'
      - '.github/workflows/w039-label-conditional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-label-matched-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical library
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Verify truth-mask and stratification unit tests
        run: python -m unittest tests.test_w039_label_conditioned -q
      - name: Generate frozen independent matched sample and evaluate
        env:
          W039_REPORT_PATH: w039_conditional_raw.json
        run: python -m scripts.benchmark_w039_label_conditioned
      - uses: actions/upload-artifact@v4
        with:
          name: w039-conditional-raw
          path: w039_conditional_raw.json
          retention-days: 90
