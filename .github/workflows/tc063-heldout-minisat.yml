name: TC-063 held-out native certificate versus MiniSat

on:
  push:
    branches:
      - research/autonomous-parity-separator-repair-v118
    paths:
      - scripts/benchmark_tc063_heldout_minisat.py
      - .github/workflows/tc063-heldout-minisat.yml
      - witnora_core/separator_affine_family_theorem.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent MiniSat oracle (PySAT)
        run: python -m pip install 'python-sat==1.8.dev24'
      - name: Held-out guarded affine SAT/UNSAT and certificate agreement
        run: python -m scripts.benchmark_tc063_heldout_minisat --trials 2 --output tc063_heldout_minisat.json
      - name: Archive all timings and certificate outcomes
        uses: actions/upload-artifact@v4
        with:
          name: tc063-heldout-minisat-${{ github.sha }}
          path: tc063_heldout_minisat.json
          if-no-files-found: error
