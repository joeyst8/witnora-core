name: Signed integer semantic refinement

on:
  push:
    branches:
      - research/signed-int-semantics-v39
  pull_request:
    paths:
      - "formal/Witnora/SignedIntSemanticBridge.lean"
      - ".github/workflows/signed-int-semantics.yml"
  workflow_dispatch:

jobs:
  theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check signed integer semantic refinement
        working-directory: formal
        run: lake build Witnora.SignedIntSemanticBridge
      - name: Reject sorry, axioms and unsafe declarations
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]])' formal/Witnora/SignedIntSemanticBridge.lean; then
            exit 1
          fi
