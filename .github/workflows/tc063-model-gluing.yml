name: TC-063 model gluing formal proof

on:
  push:
    branches:
      - formal/tc063-model-gluing-v61
  pull_request:
    paths:
      - "formal/Witnora/TC063ModelGluing.lean"
      - ".github/workflows/tc063-model-gluing.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check model locality and gluing
        working-directory: formal
        run: lake build Witnora.TC063ModelGluing
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/TC063ModelGluing.lean; then
            exit 1
          fi
