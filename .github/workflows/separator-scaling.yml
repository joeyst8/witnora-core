name: Separator scaling research gate

on:
  push:
    branches:
      - 'research/separator-scaling-v9'
  pull_request:
    paths:
      - 'witnora_core/separator_scaling_families.py'
      - 'tests/test_separator_scaling_families.py'
      - 'scripts/benchmark_separator_scaling.py'
      - '.github/workflows/separator-scaling.yml'

jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent SAT solvers
        run: python -m pip install 'python-sat==1.8.dev24'
      - name: Check planted separators and SAT behavior
        run: PYTHONPATH=. python -m unittest tests.test_separator_scaling_families -v
      - name: Measure scaling against direct Glucose3
        run: PYTHONPATH=. python scripts/benchmark_separator_scaling.py
      - name: Archive per-size raw median data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: separator-scaling-${{ github.sha }}
          path: separator-scaling.csv
          if-no-files-found: ignore
