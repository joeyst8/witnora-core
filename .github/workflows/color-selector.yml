name: Color repair selector

on:
  push:
    branches:
      - research/color-repair-selector-v26
  pull_request:
    paths:
      - "witnora_core/color_selector_lab.py"
      - "scripts/experiment_color_selector.py"
      - "tests/test_color_selector_lab.py"
      - ".github/workflows/color-selector.yml"
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify cheap selector correctness
        run: PYTHONPATH=. python -m unittest tests.test_color_selector_lab -v
      - name: Freeze train rule and evaluate independent holdouts
        run: PYTHONPATH=. python scripts/experiment_color_selector.py
      - uses: actions/upload-artifact@v4
        with:
          name: color-selector-ledger
          path: color-selector-ledger.json
