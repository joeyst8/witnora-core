name: G5 verified DAG emitter

on:
  push:
    branches:
      - formal/g5-verified-dag-emitter-v67
  pull_request:
    paths:
      - "formal/Witnora/G5VerifiedDagEmitter.lean"
      - ".github/workflows/g5-verified-dag-emitter.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check indexed DAG emitter and replay
        working-directory: formal
        run: lake build Witnora.G5VerifiedDagEmitter
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5VerifiedDagEmitter.lean; then
            exit 1
          fi
