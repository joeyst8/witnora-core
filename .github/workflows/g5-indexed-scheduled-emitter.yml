name: G5 indexed scheduled emitter
on:
  push:
    branches: [formal/g5-indexed-scheduled-emitter-v83]
  pull_request:
    paths:
      - "formal/Witnora/G5IndexedScheduledEmitter.lean"
      - ".github/workflows/g5-indexed-scheduled-emitter.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check indexed G5 variable schedule emitter
        working-directory: formal
        run: lake build Witnora.G5IndexedScheduledEmitter
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5IndexedScheduledEmitter.lean; then
            exit 1
          fi
