name: W037 held-out geometry predictions integrity audit

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - 'research/results/w037_stats_raw.json.gz'
      - 'docs/W_CROSSDOMAIN_037_CONDITIONAL_GEOMETRY_RESULTS.md'
      - '.github/workflows/w037-results-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-heldout-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned linear algebra
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Verify exact source features, folds, predictions and permutation p
        run: |
          python - <<'PY'
          import gzip,hashlib,json,math,random
          from pathlib import Path
          import numpy as np
          from scripts.w037_geometry_features import features,FEATURE_NAMES
          from scripts.benchmark_w037_prediction import SEED,SIZES,PERMUTATIONS,load_frozen,fixed_folds,predict,mse,W034_SHA,W035_SHA
          from scripts.w035_dpll_reference import solve

          packed=Path('research/results/w037_stats_raw.json.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest()=='127c50544c80722b76f75f1b8d89f24c763be33d845d3b0c46c81ccf4456fa48'
          raw=gzip.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='a85512a0c561a2560ed8416bc330ea55de1b598f1b3fb7feb86743a14773cd95'
          d=json.loads(raw)
          original=load_frozen('research/results/w034_weighted_small_raw.json.gz',W034_SHA)
          costs=load_frozen('research/results/w035_cost_raw.json.gz',W035_SHA)
          assert d['case_count']==len(d['rows'])==200
          rows=d['rows'];sizes=[r['clauses'] for r in rows]
          folds=fixed_folds(sizes)
          for row,a,b,fold in zip(rows,original['rows'],costs['rows'],folds):
              assert row['case_id']==a['case_id']==b['case_id']
              assert row['heldout_fold']==fold
              assert row['features']==features(5,a['clauses']) or all(abs(row['features'][key]-features(5,a['clauses'])[key])<1e-11 for key in FEATURE_NAMES)
              target=solve(a['clauses'])['clause_scans']
              assert target==row['target_clause_scans']
              assert math.isclose(math.log1p(target),row['target_log_scans'],rel_tol=1e-13)
          y=np.asarray([r['target_log_scans'] for r in rows])
          x=np.asarray([[r['features'][key] for key in FEATURE_NAMES] for r in rows])
          plain,enhanced=predict(x,y,sizes,folds)
          assert math.isclose(mse(y,plain),d['baseline_heldout_mse'],rel_tol=1e-11)
          assert math.isclose(mse(y,enhanced),d['geometry_heldout_mse'],rel_tol=1e-11)
          for i,row in enumerate(rows):
              assert math.isclose(row['baseline_heldout_prediction'],plain[i],rel_tol=1e-10)
              assert math.isclose(row['geometry_heldout_prediction'],enhanced[i],rel_tol=1e-10)
          base=mse(y,plain)
          observed=(base-mse(y,enhanced))/base
          rng=random.Random(SEED+1)
          null=[]
          for _ in range(PERMUTATIONS):
              copy=x.copy()
              for size in SIZES:
                  ids=[i for i,n in enumerate(sizes) if n==size]
                  shuffled=ids.copy();rng.shuffle(shuffled)
                  copy[ids]=x[shuffled]
              _,predicted=predict(copy,y,sizes,folds)
              null.append((base-mse(y,predicted))/base)
          assert np.allclose(null,d['permutation_null_improvements'],rtol=1e-11,atol=1e-12)
          assert math.isclose(d['within_size_permutation_p'],(1+sum(v>=observed for v in null))/201,rel_tol=1e-12)
          print('W037_INTEGRITY_OK: 200 source-verified feature vectors, held-out predictions and 200 null draws')
          PY
