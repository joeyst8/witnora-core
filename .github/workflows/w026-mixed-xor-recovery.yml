name: W026 mixed CNF XOR recovery gate
on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - "rust/witnora-ve/src/bin/witnora_mixed_xor_recovery.rs"
      - "tests/test_mixed_xor_recovery_rust.py"
      - ".github/workflows/w026-mixed-xor-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust exact extraction tests
        run: cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_mixed_xor_recovery
      - name: Independent Python source reconstruction
        run: |
          cargo build --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_mixed_xor_recovery
          WITNORA_RUST_MIXED_BIN="$PWD/rust/witnora-ve/target/release/witnora_mixed_xor_recovery" python -m unittest tests.test_mixed_xor_recovery_rust -v
      - name: Export original Rust JSON and emit archive markers
        env:
          W026_REPORT_PATH: ${{ runner.temp }}/w026_mixed_xor_recovery.json
        run: |
          rust/witnora-ve/target/release/witnora_mixed_xor_recovery --json > "$W026_REPORT_PATH"
          python -m json.tool "$W026_REPORT_PATH" > /dev/null
          echo "W026_EVIDENCE_BEGIN"
          python -c 'import os,pathlib;print(pathlib.Path(os.environ["W026_REPORT_PATH"]).read_text())'
          echo "W026_EVIDENCE_END"
      - name: Preserve raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w026-mixed-xor-recovery
          path: ${{ runner.temp }}/w026_mixed_xor_recovery.json
          if-no-files-found: ignore
