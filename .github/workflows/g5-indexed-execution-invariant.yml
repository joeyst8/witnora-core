name: G5 indexed execution invariant

on:
  push:
    branches:
      - formal/g5-indexed-execution-invariant-v70
  pull_request:
    paths:
      - "formal/Witnora/G5IndexedExecutionInvariant.lean"
      - "formal/Witnora/G5IndexedReferenceSafety.lean"
      - ".github/workflows/g5-indexed-execution-invariant.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check all-operation reference length
        working-directory: formal
        run: lake build Witnora.G5IndexedExecutionInvariant Witnora.G5IndexedReferenceSafety
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5IndexedExecutionInvariant.lean formal/Witnora/G5IndexedReferenceSafety.lean; then
            exit 1
          fi
