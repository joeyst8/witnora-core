name: Multi-component native G14 to Lean

on:
  push:
    branches:
      - research/g14-multicomponent-v46
  pull_request:
    paths:
      - "witnora_core/python_g14_lean_artifact.py"
      - "scripts/generate_python_g14_multicomponent_lean.py"
      - "tests/test_python_g14_multicomponent.py"
      - ".github/workflows/g14-multicomponent-lean.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify two native selected components across opposite G14 branches
        run: PYTHONPATH=. python -m unittest tests.test_python_g14_multicomponent -v
      - name: Emit Python G14 multi-component source proof
        run: PYTHONPATH=. python scripts/generate_python_g14_multicomponent_lean.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Build checked G14 theorem
        working-directory: formal
        run: lake build Witnora.G14ConcreteBridge
      - name: Kernel-check native multi-component G14 branches, G5 traces, and UNSAT
        working-directory: formal
        run: /usr/bin/time -f 'LEAN_G14_MULTI_SECONDS=%e PEAK_MEMORY_KB=%M' lake env lean Witnora/GeneratedPythonG14Multi.lean
      - name: Reject holes and native evaluation
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/GeneratedPythonG14Multi.lean; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-g14-multi-component-lean
          path: formal/Witnora/GeneratedPythonG14Multi.lean
