name: W037 held-out geometry statistics conditioned on clause count

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - 'scripts/w037_geometry_features.py'
      - 'scripts/benchmark_w037_prediction.py'
      - 'tests/test_w037_geometry_features.py'
      - 'docs/W_CROSSDOMAIN_037_CONDITIONAL_GEOMETRY_PROTOCOL.md'
      - '.github/workflows/w037-conditional-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional-feature-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin geometry linear algebra dependency
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Independently verify source-geometry invariance
        run: python -m unittest tests.test_w037_geometry_features tests.test_w035_dpll_reference -v
      - name: Audit SHA-frozen evidence and compute held-out statistics
        timeout-minutes: 15
        env:
          W037_REPORT_PATH: ${{ runner.temp }}/w037_stats_raw.json
        run: python -m scripts.benchmark_w037_prediction
      - name: Preserve original features, predictions and null draws
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w037-conditional-stats-raw
          path: ${{ runner.temp }}/w037_stats_raw.json
          if-no-files-found: ignore
          retention-days: 90
