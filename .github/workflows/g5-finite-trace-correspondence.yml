name: G5 finite trace correspondence
on:
  push:
    branches: [formal/g5-finite-trace-correspondence-v76]
  pull_request:
    paths:
      - "formal/Witnora/G5FiniteTraceCorrespondence.lean"
      - ".github/workflows/g5-finite-trace-correspondence.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check finite G5 source replay correspondence
        working-directory: formal
        run: lake build Witnora.G5FiniteTraceCorrespondence
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5FiniteTraceCorrespondence.lean; then
            exit 1
          fi
