name: Experimental nonedge matching graph bound

on:
  push:
    branches:
      - 'research/graph-nonedge-matching-v20'
  pull_request:
    paths:
      - 'witnora_core/nonedge_matching_bound.py'
      - 'tests/test_nonedge_matching_bound.py'
      - 'scripts/experiment_nonedge_matching_bound.py'
      - '.github/workflows/nonedge-matching-bound.yml'

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify coloring witnesses and exhaustive small graphs
        run: PYTHONPATH=. python -m unittest tests.test_nonedge_matching_bound -v
      - name: Run exhaustive discovery and distribution-shift holdouts
        run: PYTHONPATH=. python scripts/experiment_nonedge_matching_bound.py
      - name: Archive counterexamples and matching witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonedge-matching-bound-${{ github.sha }}
          path: nonedge-matching-bound-ledger.json
          if-no-files-found: ignore
