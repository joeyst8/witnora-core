name: G5 pivot pass independent replay
on:
  push:
    branches: [formal/g5-pivot-pass-independent-replay-v80]
  pull_request:
    paths:
      - "formal/Witnora/G5PivotPassIndependentReplay.lean"
      - ".github/workflows/g5-pivot-pass-independent-replay.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check pivot pass independent replay
        working-directory: formal
        run: lake build Witnora.G5PivotPassIndependentReplay
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5PivotPassIndependentReplay.lean; then
            exit 1
          fi
