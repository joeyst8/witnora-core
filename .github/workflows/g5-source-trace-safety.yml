name: G5 source trace safety
on:
  push:
    branches: [formal/g5-source-trace-safety-v73]
  pull_request:
    paths:
      - "formal/Witnora/G5SourceTraceSafety.lean"
      - ".github/workflows/g5-source-trace-safety.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check G5 source trace safety
        working-directory: formal
        run: lake build Witnora.G5SourceTraceSafety
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5SourceTraceSafety.lean; then
            exit 1
          fi
