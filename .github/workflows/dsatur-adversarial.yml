name: DSATUR adversarial search

on:
  push:
    branches:
      - research/dsatur-adversarial-v21
  pull_request:
    paths:
      - "witnora_core/dsatur_adversarial_lab.py"
      - "scripts/experiment_dsatur_adversarial.py"
      - "tests/test_dsatur_adversarial_lab.py"
      - ".github/workflows/dsatur-adversarial.yml"
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact coloring decision engine
        run: PYTHONPATH=. python -m unittest tests.test_dsatur_adversarial_lab -v
      - name: Run seeded adversarial study
        run: PYTHONPATH=. python scripts/experiment_dsatur_adversarial.py
      - uses: actions/upload-artifact@v4
        with:
          name: dsatur-adversarial-ledger
          path: dsatur-adversarial-ledger.json
