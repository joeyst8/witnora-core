name: Python to Lean graph-color certificate bridge

on:
  push:
    branches:
      - research/python-lean-color-bridge-v30
  pull_request:
    paths:
      - "witnora_core/lean_color_certificate_export.py"
      - "scripts/generate_lean_color_certificates.py"
      - "tests/test_lean_color_certificate_export.py"
      - ".github/workflows/python-lean-color-bridge.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check deterministic exporter inputs
        run: PYTHONPATH=. python -m unittest tests.test_lean_color_certificate_export -v
      - name: Generate Lean from actual Python DSATUR colorings
        run: PYTHONPATH=. python scripts/generate_lean_color_certificates.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Build trusted Lean concrete checker
        working-directory: formal
        run: lake build Witnora.ConcreteColorCertificate
      - name: Kernel-check generated Python witnesses
        working-directory: formal
        run: lake env lean Witnora/GeneratedColorCertificates.lean
      - name: Archive generated source for audit
        uses: actions/upload-artifact@v4
        with:
          name: generated-color-certificates
          path: formal/Witnora/GeneratedColorCertificates.lean
