name: W038 independent 8var cheap-geometry replication

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - 'scripts/w038_cheap_geometry.py'
      - 'scripts/benchmark_w038_independent.py'
      - 'tests/test_w038_cheap_geometry.py'
      - 'docs/W_CROSSDOMAIN_038_INDEPENDENT_CHEAP_GEOMETRY_PROTOCOL.md'
      - '.github/workflows/w038-independent-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-frozen-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned linear algebra
        run: python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Check analytic overlap and spectral equivalence
        run: python -m unittest tests.test_w038_cheap_geometry -q
      - name: Run fixed independent sample
        env:
          W038_REPORT_PATH: w038_independent_raw.json
        run: python -m scripts.benchmark_w038_independent
      - uses: actions/upload-artifact@v4
        with:
          name: w038-independent-raw
          path: w038_independent_raw.json
          retention-days: 90
