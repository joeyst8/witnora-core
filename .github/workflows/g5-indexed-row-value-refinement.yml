name: G5 indexed working-row semantic refinement

on:
  push:
    branches:
      - formal/g5-indexed-row-value-refinement-v71
  pull_request:
    paths:
      - "formal/Witnora/G5IndexedRowValueRefinement.lean"
      - ".github/workflows/g5-indexed-row-value-refinement.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check indexed row-value updates
        working-directory: formal
        run: lake build Witnora.G5IndexedRowValueRefinement
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5IndexedRowValueRefinement.lean; then
            exit 1
          fi
