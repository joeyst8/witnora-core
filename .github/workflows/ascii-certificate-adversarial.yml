name: Adversarial Python ASCII Lean certificates

on:
  push:
    branches:
      - research/ascii-adversarial-v36
  pull_request:
    paths:
      - "witnora_core/ascii_certificate_adversarial.py"
      - "scripts/generate_adversarial_ascii_lean.py"
      - "tests/test_ascii_certificate_adversarial.py"
      - ".github/workflows/ascii-certificate-adversarial.yml"
  workflow_dispatch:

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 200 independently serialized seeded multipartite instances and mutations
        run: PYTHONPATH=. python -m unittest tests.test_ascii_certificate_adversarial -v
      - name: Generate eight real Python-to-ASCII certificates
        run: PYTHONPATH=. python scripts/generate_adversarial_ascii_lean.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Build verified byte-list checker
        working-directory: formal
        run: lake build Witnora.KernelAsciiNumericCertificate
      - name: Time kernel verification of eight certificates and their corruption tests
        working-directory: formal
        run: /usr/bin/time -f 'LEAN_VERIFICATION_SECONDS=%e PEAK_MEMORY_KB=%M' lake env lean Witnora/GeneratedAdversarialAsciiCertificates.lean
      - name: Reject unproved or native evaluated generated declarations
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/GeneratedAdversarialAsciiCertificates.lean; then
            echo "Untrusted declaration in generated certificate"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: adversarial-python-ascii-lean-source
          path: formal/Witnora/GeneratedAdversarialAsciiCertificates.lean
