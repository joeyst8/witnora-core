name: Universal G14 component routing
on:
  push:
    branches:
      - formal/g14-universal-component-routing-v112
  pull_request:
    paths:
      - "formal/Witnora/G14ComponentRouting.lean"
      - ".github/workflows/g14-component-routing.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check universal G14 routing
        working-directory: formal
        run: lake build Witnora.G14ComponentRouting
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14ComponentRouting.lean; then
            exit 1
          fi
