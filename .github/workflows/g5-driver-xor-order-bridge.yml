name: G5 driver XOR order bridge
on:
  push:
    branches: [formal/g5-driver-xor-order-bridge-v77]
  pull_request:
    paths:
      - "formal/Witnora/G5DriverXorOrderBridge.lean"
      - ".github/workflows/g5-driver-xor-order-bridge.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check G5 driver XOR order bridge
        working-directory: formal
        run: lake build Witnora.G5DriverXorOrderBridge
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5DriverXorOrderBridge.lean; then
            exit 1
          fi
