name: Witnora Lean formal proof gate

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'tests/test_formal_differential.py'
      - 'tests/test_xor_empty_encoding.py'
      - 'witnora_core/xor.py'
      - 'witnora_core/cnf.py'
      - 'witnora_core/dimacs.py'
      - 'tests/test_dimacs_refinement.py'
      - 'witnora_core/lean_g5_gate.py'
      - 'witnora_core/lean_g14_gate.py'
      - 'tests/test_lean_g14_gate.py'
      - 'witnora_core/separator_affine_family_theorem.py'
      - 'tests/test_separator_affine_family_*.py'
      - 'tests/test_lean_g5_gate.py'
      - 'scripts/benchmark_affine_sat.py'
      - 'scripts/emit_lean_separator_fixtures.py'
      - 'scripts/emit_lean_g5_traces.py'
      - 'scripts/emit_lean_xor_encoding.py'
      - 'scripts/emit_lean_cnf_canonical.py'
      - '.github/workflows/lean-formal.yml'
  push:
    branches:
      - 'research/tc063-eth-audit-20261029'
    paths:
      - 'formal/**'
      - 'tests/test_formal_differential.py'
      - 'tests/test_xor_empty_encoding.py'
      - 'witnora_core/xor.py'
      - 'witnora_core/cnf.py'
      - 'witnora_core/dimacs.py'
      - 'tests/test_dimacs_refinement.py'
      - 'witnora_core/lean_g5_gate.py'
      - 'witnora_core/lean_g14_gate.py'
      - 'tests/test_lean_g14_gate.py'
      - 'witnora_core/separator_affine_family_theorem.py'
      - 'tests/test_separator_affine_family_*.py'
      - 'tests/test_lean_g5_gate.py'
      - 'scripts/benchmark_affine_sat.py'
      - 'scripts/emit_lean_separator_fixtures.py'
      - 'scripts/emit_lean_g5_traces.py'
      - 'scripts/emit_lean_xor_encoding.py'
      - 'scripts/emit_lean_cnf_canonical.py'
      - '.github/workflows/lean-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run G14 Python regression suite
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_separator_affine_family_*.py'
      - name: Test DIMACS parse/canonicalization refinement
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_dimacs_refinement.py'
      - name: Run zero-variable XOR regression tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_xor_empty_encoding.py'
      - name: Run G5 Python regression suite
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_affine_residue_*.py'
      - name: Test fail-closed production Lean G5 gate
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_lean_g5_gate.py'
      - name: Test fail-closed G14 Lean cover gate
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_lean_g14_gate.py'
      - name: Install independent Glucose3 SAT oracle
        run: python -m pip install 'python-sat==1.8.dev24'
      - name: Randomized differential tests of G5 and G14
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_formal_differential.py'
      - name: Cross-check G5 and G14 certificates against Glucose3
        run: PYTHONPATH=. python scripts/benchmark_affine_sat.py
      - name: Generate concrete Lean claims from Python G14
        run: PYTHONPATH=. python scripts/emit_lean_separator_fixtures.py
      - name: Generate concrete Lean G5 trace claims from Python
        run: PYTHONPATH=. python scripts/emit_lean_g5_traces.py
      - name: Generate Python canonical CNF normalization claims
        run: PYTHONPATH=. python scripts/emit_lean_cnf_canonical.py
      - name: Generate Python canonical XOR encoder claims
        run: PYTHONPATH=. python scripts/emit_lean_xor_encoding.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false

      - name: Kernel-check Python/Lean CNF normalization correspondence
        working-directory: formal
        run: lake env lean Witnora/CNFCanonicalGenerated.lean
      - name: Kernel-check canonical XOR encoding claims
        working-directory: formal
        run: lake env lean Witnora/XorGenerated.lean
      - name: Kernel-check actual G5 trace replay claims
        working-directory: formal
        run: lake env lean Witnora/G5Generated.lean
      - name: Kernel-check concrete G14 branch claims
        working-directory: formal
        run: lake env lean Witnora/Generated.lean
      - name: Execute real runtime Lean verification on a G5 UNSAT certificate
        run: |
          PYTHONPATH=. python -c 'from witnora_core.operator_genesis import make_affine_residue_instance, build_affine_residue_certificate; from witnora_core.lean_g5_gate import verify_g5_certificate_with_lean; instance = make_affine_residue_instance("parity_arity_7_unsat"); cert = build_affine_residue_certificate(instance); result = verify_g5_certificate_with_lean(instance.formula, cert); print(result); assert result["verified"], result'
      - name: Execute real G14 branch-cover Lean verification
        run: |
          PYTHONPATH=. python -c 'from witnora_core.separator_affine_family_theorem import make_separator_affine_instance,build_separator_affine_certificate; from witnora_core.lean_g14_gate import verify_g14_unsat_cover_with_lean; instance=make_separator_affine_instance("saf_unsat_cover_2"); cert=build_separator_affine_certificate(instance); result=verify_g14_unsat_cover_with_lean(instance.formula,cert); print(result); assert result["verified"],result'
