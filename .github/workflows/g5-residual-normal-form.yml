name: G5 residual normal form

on:
  push:
    branches:
      - formal/g5-residual-normal-form-v65
  pull_request:
    paths:
      - "formal/Witnora/G5ResidualNormalForm.lean"
      - ".github/workflows/g5-residual-normal-form.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check absence preservation
        working-directory: formal
        run: lake build Witnora.G5ResidualNormalForm
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5ResidualNormalForm.lean; then
            exit 1
          fi
