name: G5 scheduled model preservation
on:
  push:
    branches: [formal/g5-scheduled-model-preservation-v85]
  pull_request:
    paths:
      - "formal/Witnora/G5ScheduledModelPreservation.lean"
      - ".github/workflows/g5-scheduled-model-preservation.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check full scheduled model preservation
        working-directory: formal
        run: lake build Witnora.G5ScheduledModelPreservation
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5ScheduledModelPreservation.lean; then
            exit 1
          fi
