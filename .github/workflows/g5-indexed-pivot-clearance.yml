name: G5 indexed pivot clearance
on:
  push:
    branches: [formal/g5-indexed-pivot-clearance-v86]
  pull_request:
    paths:
      - "formal/Witnora/G5IndexedPivotClearance.lean"
      - ".github/workflows/g5-indexed-pivot-clearance.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check source-order indexed pivot clearance
        working-directory: formal
        run: lake build Witnora.G5IndexedPivotClearance
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5IndexedPivotClearance.lean; then
            exit 1
          fi
