name: G5 executable contradiction completeness
on:
  push:
    branches: [formal/g5-executable-contradiction-complete-v104]
  pull_request:
    paths:
      - "formal/Witnora/G5ExecutableContradictionComplete.lean"
      - ".github/workflows/g5-executable-contradiction-complete.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check executable G5 contradiction completeness
        working-directory: formal
        run: lake build Witnora.G5ExecutableContradictionComplete
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5ExecutableContradictionComplete.lean; then
            exit 1
          fi