name: Exact signed XOR-CNF theorem

on:
  push:
    branches:
      - research/exact-signed-xor-cnf-v37
  pull_request:
    paths:
      - "formal/Witnora/ExactSignedXorCNF.lean"
      - ".github/workflows/exact-signed-xor-cnf.yml"
  workflow_dispatch:

jobs:
  theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check universal signed-clause iff theorem
        working-directory: formal
        run: lake build Witnora.ExactSignedXorCNF
      - name: Reject sorry, axioms and unsafe declarations
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]])' formal/Witnora/ExactSignedXorCNF.lean; then
            echo "Unproved declaration in XOR-CNF equivalence"
            exit 1
          fi
