name: XNF frontier research reproducibility gate (WU-014 through WU-021)

on:
  pull_request:
    paths:
      - "scripts/wu014_*.py"
      - "scripts/test_wu014_*.py"
      - "scripts/wu015_*.py"
      - "scripts/test_wu015_*.py"
      - "scripts/wu016_*.py"
      - "scripts/test_wu016_*.py"
      - "scripts/test_wu017_*.py"
      - "scripts/wu018_*.py"
      - "scripts/test_wu018_*.py"
      - "scripts/wu019_*.py"
      - "scripts/test_wu019_*.py"
      - "scripts/wu020_*.py"
      - "scripts/test_wu020_*.py"
      - "scripts/wu021_*.py"
      - "scripts/test_wu021_*.py"
      - "research_patches/wu016_*"
      - "research_patches/wu017_*"
      - "research_patches/wu018_*"
      - "research_patches/wu019_*"
      - "research_patches/wu020_*"
      - "research_patches/wu021_*"
      - "research_data/wu014/**"
      - "research_data/wu015/**"
      - "research_data/wu016/**"
      - "research_data/wu017/**"
      - "research_data/wu018/**"
      - "research_data/wu019/**"
      - "research_data/wu020/**"
      - "research_data/wu021/**"
      - "rust/witnora-ve/src/bin/wu018_*.rs"
      - "rust/witnora-ve/src/bin/wu019_*.rs"
      - "rust/witnora-ve/src/bin/wu020_*.rs"
      - ".github/workflows/xnf-frontier-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witnora-xnf-frontier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stdlib-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact-model, dual-certificate and profiler parser tests
        run: |
          python -m unittest -v \
            scripts.test_wu014_real_solver_pilot \
            scripts.test_wu015_xorcle_ablation \
            scripts.test_wu016_profile_xorcle \
            scripts.test_wu016_linear_gate \
            scripts.test_wu017_quotient_signatures \
            scripts.test_wu018_benchmark_dual \
            scripts.test_wu019_benchmark_wide \
            scripts.test_wu021_benchmark_hybrid

  rust-dual-certificate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify small and wide mathematical duals and planted generator
        run: |
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml \
            --bin wu018_dual_certificate
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml \
            --bin wu019_wide_dual_certificate
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml \
            --bin wu019_generate_wide_xnf
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml \
            --bin wu020_seeded_dual_certificate
