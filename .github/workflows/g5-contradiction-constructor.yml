name: G5 contradiction constructor proofs

on:
  push:
    branches:
      - formal/g5-contradiction-constructor-v62
  pull_request:
    paths:
      - "formal/Witnora/G5ContradictionConstructor.lean"
      - ".github/workflows/g5-contradiction-constructor.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check constructive G5 base cases
        working-directory: formal
        run: lake build Witnora.G5ContradictionConstructor
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5ContradictionConstructor.lean; then
            exit 1
          fi
