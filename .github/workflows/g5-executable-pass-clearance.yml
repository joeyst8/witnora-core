name: G5 executable pass clearance
on:
  push:
    branches: [formal/g5-executable-pass-clearance-v88]
  pull_request:
    paths:
      - "formal/Witnora/G5ExecutablePassClearance.lean"
      - ".github/workflows/g5-executable-pass-clearance.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check executable pass clearance
        working-directory: formal
        run: lake build Witnora.G5ExecutablePassClearance
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5ExecutablePassClearance.lean; then
            exit 1
          fi
