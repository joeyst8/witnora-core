name: G5 ledger survivor model
on:
  push:
    branches: [formal/g5-ledger-survivor-model-v99]
  pull_request:
    paths:
      - "formal/Witnora/G5LedgerSurvivorModel.lean"
      - ".github/workflows/g5-ledger-survivor-model.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check ledger survivor model criterion
        working-directory: formal
        run: lake build Witnora.G5LedgerSurvivorModel
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5LedgerSurvivorModel.lean; then
            exit 1
          fi