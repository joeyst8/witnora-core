name: G5 retired pivot triangular
on:
  push:
    branches: [formal/g5-retired-pivot-triangular-v98]
  pull_request:
    paths:
      - "formal/Witnora/G5RetiredPivotTriangular.lean"
      - ".github/workflows/g5-retired-pivot-triangular.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check retired pivot triangularity
        working-directory: formal
        run: lake build Witnora.G5RetiredPivotTriangular
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5RetiredPivotTriangular.lean; then
            exit 1
          fi