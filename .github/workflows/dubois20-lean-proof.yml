name: Dubois20 Lean proof experiment

on:
  push:
    branches:
      - research/autonomous-parity-separator-repair-v118
    paths:
      - theory/Dubois20SourceUnsat.lean
      - theory/TC063DuboisOneBitCover.lean
      - lean-toolchain
      - lakefile.toml
      - lake-manifest.json
      - research/PR119_DUBOIS20_SOURCE_XOR_CERTIFICATE.json
      - research/PR119_DUBOIS20_GF2_39_STEP_TRACE.json
      - tests/test_dubois_lean_bridge.py
      - tests/test_tc063_dubois_one_bit_cover.py
      - .github/workflows/dubois20-lean-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit Lean fixture against the source and indexed trace
        run: python -m unittest tests.test_dubois_lean_bridge -v
      - name: Audit TC-063 one-bit substitution fixture
        run: python -m unittest tests.test_tc063_dubois_one_bit_cover -v
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
      - name: Kernel-check the pinned Dubois20 source-clause theorem
        run: lean -o theory/Dubois20SourceUnsat.olean theory/Dubois20SourceUnsat.lean
      - name: Kernel-check the TC-063 Boolean cover and exact substitution bridge
        run: LEAN_PATH=theory lean theory/TC063DuboisOneBitCover.lean
