name: G5 initial support coverage
on:
  push:
    branches: [formal/g5-initial-support-coverage-v96]
  pull_request:
    paths:
      - "formal/Witnora/G5InitialSupportCoverage.lean"
      - ".github/workflows/g5-initial-support-coverage.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check initial-support coverage
        working-directory: formal
        run: lake build Witnora.G5InitialSupportCoverage
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5InitialSupportCoverage.lean; then
            exit 1
          fi