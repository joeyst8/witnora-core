name: Universal G14 DFS worklist invariants
on:
  push:
    branches:
      - formal/g14-dfs-worklist-invariants-v115
  pull_request:
    paths:
      - "formal/Witnora/G14DFSWorklist.lean"
      - ".github/workflows/g14-dfs-worklist-invariants.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check DFS worklist invariants
        working-directory: formal
        run: lake build Witnora.G14DFSWorklist
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14DFSWorklist.lean; then
            exit 1
          fi
