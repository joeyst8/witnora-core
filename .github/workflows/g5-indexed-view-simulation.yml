name: G5 indexed view simulation
on:
  push:
    branches: [formal/g5-indexed-view-simulation-v72]
  pull_request:
    paths:
      - "formal/Witnora/G5IndexedViewSimulation.lean"
      - ".github/workflows/g5-indexed-view-simulation.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check universal G5 indexed view
        working-directory: formal
        run: lake build Witnora.G5IndexedViewSimulation
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5IndexedViewSimulation.lean; then
            exit 1
          fi
