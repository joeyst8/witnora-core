name: G5 complete checked certificate
on:
  push:
    branches: [formal/g5-complete-checked-certificate-v105]
  pull_request:
    paths:
      - "formal/Witnora/G5CompleteCheckedCertificate.lean"
      - ".github/workflows/g5-complete-checked-certificate.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check complete executable G5 certificate acceptance
        working-directory: formal
        run: lake build Witnora.G5CompleteCheckedCertificate
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5CompleteCheckedCertificate.lean; then
            exit 1
          fi