name: W024 second versus third moment barrier

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - "rust/witnora-ve/src/bin/witnora_moment_barrier.rs"
      - "tests/test_moment_barrier_rust.py"
      - ".github/workflows/w024-moment-barrier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-moment-barrier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run exact Rust unit tests
        run: cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_moment_barrier
      - name: Build Rust binary and run 64 independent Python audits
        run: |
          cargo build --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_moment_barrier
          WITNORA_RUST_MOMENT_BIN="$PWD/rust/witnora-ve/target/release/witnora_moment_barrier" python -m unittest tests.test_moment_barrier_rust -v
      - name: Capture complete raw Rust evidence
        env:
          W024_REPORT_PATH: ${{ runner.temp }}/w024_moment_barrier.json
        run: |
          rust/witnora-ve/target/release/witnora_moment_barrier --json > "$W024_REPORT_PATH"
          python -m json.tool "$W024_REPORT_PATH" > /dev/null
      - name: Preserve reproducible raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w024-exact-moment-barrier
          path: ${{ runner.temp }}/w024_moment_barrier.json
          if-no-files-found: ignore
