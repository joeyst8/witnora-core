name: Direct TC-063 contract and adversarial membership

on:
  push:
    branches:
      - research/tc063-direct-contract-v53
  pull_request:
    paths:
      - "formal/Witnora/TC063Direct.lean"
      - "tests/test_tc063_direct_attack.py"
      - ".github/workflows/tc063-direct-contract.yml"
  workflow_dispatch:

jobs:
  direct-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe membership boundary with non-affine residual
        run: PYTHONPATH=. python -m unittest tests.test_tc063_direct_attack -v
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Prove direct conditional TC-063 contract
        working-directory: formal
        run: lake build Witnora.TC063Direct
      - name: Reject proof holes and axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/TC063Direct.lean; then
            exit 1
          fi
