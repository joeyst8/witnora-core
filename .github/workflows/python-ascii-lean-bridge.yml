name: Python ASCII to kernel Lean

on:
  push:
    branches:
      - research/python-ascii-bridge-v35
  pull_request:
    paths:
      - "witnora_core/lean_ascii_certificate_export.py"
      - "scripts/generate_ascii_lean_certificates.py"
      - "tests/test_lean_ascii_certificate_export.py"
      - ".github/workflows/python-ascii-lean-bridge.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check deterministic ASCII serialization and invalid cases
        run: PYTHONPATH=. python -m unittest tests.test_lean_ascii_certificate_export -v
      - name: Generate ASCII byte lists and proof declarations from Python DSATUR
        run: PYTHONPATH=. python scripts/generate_ascii_lean_certificates.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Build verified byte-list parser
        working-directory: formal
        run: lake build Witnora.KernelAsciiNumericCertificate
      - name: Kernel-check Python byte lists and damage-rejection certificates
        working-directory: formal
        run: lake env lean Witnora/GeneratedAsciiCertificates.lean
      - name: Disallow native evaluation and unproved generated declarations
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/GeneratedAsciiCertificates.lean; then
            echo "Untrusted declaration in generated byte-list proof"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated-python-ascii-lean
          path: formal/Witnora/GeneratedAsciiCertificates.lean
