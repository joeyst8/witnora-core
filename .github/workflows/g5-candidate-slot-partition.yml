name: G5 candidate slot partition
on:
  push:
    branches: [formal/g5-candidate-slot-partition-v102]
  pull_request:
    paths:
      - "formal/Witnora/G5CandidateSlotPartition.lean"
      - ".github/workflows/g5-candidate-slot-partition.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check candidate slot partition
        working-directory: formal
        run: lake build Witnora.G5CandidateSlotPartition
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5CandidateSlotPartition.lean; then
            exit 1
          fi