name: G14 SAT residual model transfer
on:
  push:
    branches:
      - formal/g14-sat-model-transfer-adversarial-v108
  pull_request:
    paths:
      - "formal/Witnora/G14ModelTransferExperiment.lean"
      - ".github/workflows/g14-model-transfer-experiment.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check adversarial model transfer
        working-directory: formal
        run: lake build Witnora.G14ModelTransferExperiment
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G14ModelTransferExperiment.lean; then
            exit 1
          fi
