name: G5 canonical CNF equivalence
on:
  push:
    branches:
      - formal/g5-canonical-cnf-equivalence-v107
  pull_request:
    paths:
      - "formal/Witnora/G5CanonicalCNFEquivalence.lean"
      - ".github/workflows/g5-canonical-cnf-equivalence.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check canonical CNF bridge
        working-directory: formal
        run: lake build Witnora.G5CanonicalCNFEquivalence
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5CanonicalCNFEquivalence.lean; then
            exit 1
          fi
