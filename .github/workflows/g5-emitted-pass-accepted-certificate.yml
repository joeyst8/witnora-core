name: G5 emitted pass accepted certificate
on:
  push:
    branches: [formal/g5-emitted-pass-accepted-certificate-v81]
  pull_request:
    paths:
      - "formal/Witnora/G5EmittedPassAcceptedCertificate.lean"
      - ".github/workflows/g5-emitted-pass-accepted-certificate.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check generated pass certificate soundness
        working-directory: formal
        run: lake build Witnora.G5EmittedPassAcceptedCertificate
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5EmittedPassAcceptedCertificate.lean; then
            exit 1
          fi
