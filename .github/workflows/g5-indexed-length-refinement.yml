name: G5 indexed-reference length refinement

on:
  push:
    branches:
      - formal/g5-indexed-length-refinement-v69
  pull_request:
    paths:
      - "formal/Witnora/G5IndexedLengthRefinement.lean"
      - ".github/workflows/g5-indexed-length-refinement.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check DAG row-count correspondence
        working-directory: formal
        run: lake build Witnora.G5IndexedLengthRefinement
      - name: Reject proof holes and project axioms
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5IndexedLengthRefinement.lean; then
            exit 1
          fi
