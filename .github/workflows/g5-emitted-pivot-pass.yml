name: G5 emitted pivot pass
on:
  push:
    branches: [formal/g5-emitted-pivot-pass-v79]
  pull_request:
    paths:
      - "formal/Witnora/G5EmittedPivotPass.lean"
      - ".github/workflows/g5-emitted-pivot-pass.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check G5 emitted pivot pass
        working-directory: formal
        run: lake build Witnora.G5EmittedPivotPass
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5EmittedPivotPass.lean; then
            exit 1
          fi
