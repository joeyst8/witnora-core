name: Actual Python XOR DIMACS to Lean

on:
  push:
    branches:
      - research/python-dimacs-xor-v42
  pull_request:
    paths:
      - "witnora_core/python_dimacs_xor_lean_export.py"
      - "scripts/generate_python_dimacs_xor_lean.py"
      - "tests/test_python_dimacs_xor_lean_export.py"
      - ".github/workflows/python-dimacs-xor-lean.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cross-check actual Python XOR encoder and DIMACS serialization
        run: PYTHONPATH=. python -m unittest tests.test_python_dimacs_xor_lean_export -v
      - name: Generate source byte lists from Python XOR-CNF clauses
        run: PYTHONPATH=. python scripts/generate_python_dimacs_xor_lean.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Build verified DIMACS-to-XOR checker
        working-directory: formal
        run: lake build Witnora.DimacsXorDocument
      - name: Verify actual Python-generated source bytes and exact model equivalence
        working-directory: formal
        run: /usr/bin/time -f 'LEAN_XOR_DIMACS_SECONDS=%e PEAK_MEMORY_KB=%M' lake env lean Witnora/GeneratedPythonDimacsXor.lean
      - name: Reject proof holes and native evaluation
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/GeneratedPythonDimacsXor.lean; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated-python-xor-dimacs-lean
          path: formal/Witnora/GeneratedPythonDimacsXor.lean
