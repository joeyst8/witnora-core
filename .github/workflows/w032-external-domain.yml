name: W032 source-verified external SAT domain pilot

on:
  push:
    branches: [research/w-crc-001-asymmetric-v1]
    paths:
      - 'scripts/w032_external_cases.py'
      - 'scripts/benchmark_w032_external.py'
      - 'scripts/analyze_w032_external.py'
      - 'tests/test_w032_external_cases.py'
      - 'tests/test_w032_analysis.py'
      - 'research/results/w032_case_manifest.json'
      - 'docs/W_CROSSDOMAIN_032_EXTERNAL_DOMAIN_PROTOCOL.md'
      - '.github/workflows/w032-external-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-external-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit frozen source manifest and censoring analyzer
        run: python -m unittest tests.test_w032_external_cases tests.test_w032_analysis -v
      - name: Compile two source-certified Rust prechecks
        run: |
          cargo test --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_w030_prefix_xor
          cargo build --release --manifest-path rust/witnora-ve/Cargo.toml --bin witnora_w027_xor_precheck --bin witnora_w030_prefix_xor
          echo "W032_OLD_PRECHECK_BIN=$PWD/rust/witnora-ve/target/release/witnora_w027_xor_precheck" >> "$GITHUB_ENV"
          echo "W032_PREFIX_BIN=$PWD/rust/witnora-ve/target/release/witnora_w030_prefix_xor" >> "$GITHUB_ENV"
      - name: Independent 256-cube Rust source-certifier validation
        env:
          WITNORA_W030_PREFIX_BIN: ${{ github.workspace }}/rust/witnora-ve/target/release/witnora_w030_prefix_xor
        run: python -m unittest tests.test_w030_prefix_xor -v
      - name: Build pinned Kissat release 4.0.4
        run: |
          git clone --quiet --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/w032-kissat"
          cd "$RUNNER_TEMP/w032-kissat"
          test "$(git rev-parse HEAD)" = "8af8e56f174b778aef3aa45af9f739b2a5f492c2"
          ./configure
          make -C build -j 2 kissat
          echo "W032_KISSAT_BIN=$RUNNER_TEMP/w032-kissat/build/kissat" >> "$GITHUB_ENV"
          echo "W032_KISSAT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Download, hash-audit and time 126 original-CNF solver invocations
        timeout-minutes: 35
        env:
          W032_REPORT_PATH: ${{ runner.temp }}/w032_external_raw.json
        run: python -m scripts.benchmark_w032_external
      - name: Validate and analyze original evidence with censoring
        env:
          W032_REPORT_PATH: ${{ runner.temp }}/w032_external_raw.json
        run: |
          python -m json.tool "$W032_REPORT_PATH" > /dev/null
          python -m scripts.analyze_w032_external "$W032_REPORT_PATH"
      - name: Preserve all W032 source-verified measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w032-external-raw
          path: ${{ runner.temp }}/w032_external_raw.json
          if-no-files-found: ignore
          retention-days: 90
