name: G5 tracked survivors
on:
  push:
    branches: [formal/g5-tracked-survivors-v93]
  pull_request:
    paths:
      - "formal/Witnora/G5TrackedSurvivors.lean"
      - ".github/workflows/g5-tracked-survivors.yml"
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Kernel-check tracked scheduler correspondence
        working-directory: formal
        run: lake build Witnora.G5TrackedSurvivors
      - name: Reject proof holes
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]]|native_decide)' formal/Witnora/G5TrackedSurvivors.lean; then
            exit 1
          fi