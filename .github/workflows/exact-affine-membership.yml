name: Exact affine CNF membership

on:
  push:
    branches:
      - research/exact-affine-membership-v50
  pull_request:
    paths:
      - "formal/Witnora/ExactAffineMembership.lean"
      - ".github/workflows/exact-affine-membership.yml"
  workflow_dispatch:

jobs:
  theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Check exact affine model equivalence and negative cases
        working-directory: formal
        run: lake build Witnora.ExactAffineMembership
      - name: Reject proof holes and unsafe declarations
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]])' formal/Witnora/ExactAffineMembership.lean; then
            exit 1
          fi
