name: Concrete G14 two-branch proof

on:
  push:
    branches:
      - research/g14-concrete-instance-v43
  pull_request:
    paths:
      - "formal/Witnora/G14ConcreteInstance.lean"
      - ".github/workflows/g14-concrete-instance.yml"
  workflow_dispatch:

jobs:
  theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          test: false
      - name: Verify DIMACS two G14 branches and both G5 contradictions
        working-directory: formal
        run: lake build Witnora.G14ConcreteInstance
      - name: Reject proof holes and unsafe declarations
        run: |
          if grep -E '^[[:space:]]*(sorry|axiom|unsafe[[:space:]])' formal/Witnora/G14ConcreteInstance.lean; then
            exit 1
          fi
